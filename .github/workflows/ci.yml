name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Manifest is valid JSON and every referenced file exists
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = [m.background.service_worker, m.action.default_popup, m.options_ui.page,
              ...Object.values(m.icons), ...m.content_scripts.flatMap((c) => c.js)];
            const missing = files.filter((f) => !fs.existsSync(f));
            if (missing.length) { console.error("Missing:", missing); process.exit(1); }
            console.log("manifest OK,", files.length, "files");
          '
